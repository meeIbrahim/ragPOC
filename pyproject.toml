[project]
name = "rag-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.80.0",
    "grpcio-reflection>=1.80.0",
    "langchain>=0.3.30",
    "langchain-community>=0.3.31",
    "langchain-text-splitters>=0.3.11",
    "minio>=7.2.20",
    "numpy>=2.0.2",
    "ollama>=0.6.2",
    "pypdf>=6.16.1",
    "qdrant-client>=1.16.1",
    "sentence-transformers>=5.1.2",
    "torch>=2.8.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "grpcio-tools>=1.80.0",
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/db",
    "src/rag",
    "src/storage",
    "src/migration",
    "src/api",
    "src/generated",
]

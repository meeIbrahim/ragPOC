# Config for the docker-compose stack: every dependency is reached by its service name.
# Same keys and defaults as the repo's config.toml; only hostnames and data directories differ.
# The MinIO credentials are the local development defaults from docker-compose.yml: POC only.
# Anything shared or deployed beyond a laptop must take them from the environment or a secrets
# manager instead.

[minio]
url="minio:9000"
access_key="minio_user"
secret_key="minio_password"
upload_bucket="upload-bucket"
ingestion_bucket="ingestion-bucket"

[sqlite]
dir="/data/rag"

[qdrant]
url="http://qdrant:6333"

[rag_grpc]
port=50051

[rag]
collection="pdf-fixed"
embedding_model="qwen3-embedding"
# Output size of the pulled qwen3-embedding tag (8B = 4096). The Qdrant collection is created with it.
embedding_dim=4096
llm_model="openai/gpt-oss-120b"
top_k=5
# Chosen in Phase 1
chunk_size=0
chunk_overlap=0
# Per external call: MinIO, Ollama, Qdrant, Groq
call_timeout="60s"

[rag.consumer]
job_timeout="15m"
watchdog_grace="2m"
# Must exceed job_timeout + watchdog_grace, so a live job is never reclaimed
min_idle="20m"
recovery_interval="1m"
poison_threshold=3
# Must exceed job_timeout
consumer_cleanup_idle="1h"

[redis]
host="redis"
port=6379
stream="ingest.docs"
consumer_group="rag-pdf-fixed"
# 50 docs/min peak x 72h outage x 1.5 safety
stream_max_len=324000
status_stream="ingest.status"
status_consumer_group="center-status"

[ingestion]
# Document ingest attempts; independent of the outbox and hash worker MaxRetries in code
max_attempts=3
allowed_extensions=[".pdf", ".txt", ".md"]

[go]
port=8080
sqlite_dir="/data/go"

[go.status_consumer]
entry_timeout="5s"
min_idle="60s"
recovery_interval="30s"
poison_threshold=3
consumer_cleanup_idle="1h"

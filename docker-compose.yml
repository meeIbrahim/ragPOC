# The whole system for local runs: infrastructure, the Go center service, the Python consumer
# (stub mode in Phase 0) and, under the `e2e` profile, the e2e test runner.
#
#   docker compose up -d --build        the stack, with published ports for poking at it by hand
#   make e2e                            the compose e2e in an isolated project (see scripts/e2e.sh
#                                       and docker-compose.e2e.yml)
#
# No container_name is set, so several projects (this one and the e2e one) can run side by side.

services:
  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    volumes:
      - ./ingestion_docs/data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      # The image has neither curl nor wget, only bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    # An entry larger than this is refused by Redis instead of being read whole into the
    # consumer's memory (the consumer only checks size after the client has read the entry).
    command: ["redis-server", "--proto-max-bulk-len", "16777216"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: creates the SQLite schema and the two MinIO buckets (Go owns both buckets).
  center-migrate:
    build:
      context: ./services/center
      target: runtime
    entrypoint: ["migrate"]
    command: ["-config=/config/config.toml"]
    volumes:
      - ./deploy/config.compose.toml:/config/config.toml:ro
      - center_db:/data
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # One-shot: creates the indexed_documents table and the Qdrant collection.
  rag-migrate:
    build:
      context: ./services/rag-service
    command: ["python", "-m", "migration.main"]
    volumes:
      - ./deploy/config.compose.toml:/config/config.toml:ro
      - rag_db:/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  center:
    build:
      context: ./services/center
      target: runtime
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/config.compose.toml:/config/config.toml:ro
      - center_db:/data
    depends_on:
      center-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Any listener on the port: the image has busybox `nc`, and every HTTP route needs input.
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rag-consumer:
    build:
      context: ./services/rag-service
    environment:
      # indexed | failed-retryable | failed-permanent | crash | slow | hang
      RAG_STUB_MODE: ${RAG_STUB_MODE:-indexed}
    volumes:
      - ./deploy/config.compose.toml:/config/config.toml:ro
    # PID 1 must be an init process: the consumer has no SIGTERM handler on purpose (no graceful
    # drain), and a PID 1 without a handler ignores SIGTERM, so `docker stop` would wait for SIGKILL.
    init: true
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The e2e test binary, run by scripts/e2e.sh. It shares the center's SQLite volume (opened
  # read-only by the test) and reaches everything else by service name.
  e2e:
    profiles: ["e2e"]
    build:
      context: ./services/center
      target: e2e
    environment:
      CENTER_URL: http://center:8080
      REDIS_ADDR: redis:6379
      CENTER_DB: /data/go/center.db
    volumes:
      - ./deploy/config.compose.toml:/config/config.toml:ro
      # Read-write on purpose: a read-only mount cannot create SQLite's WAL shared-memory file.
      # The test opens the database itself with mode=ro.
      - center_db:/data
    depends_on:
      center:
        condition: service_healthy
    restart: "no"

volumes:
  center_db:
  rag_db:

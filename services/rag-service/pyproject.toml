[project]
name = "rag-service"
version = "0.1.0"
description = "RAG service: ingests documents from Redis Streams and answers questions over gRPC"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "groq>=0.30",
    "grpcio>=1.80.0",
    "grpcio-reflection>=1.80.0",
    "langchain-text-splitters>=0.3.11",
    "minio>=7.2.20",
    "ollama>=0.6.2",
    "pypdf>=6.16.1",
    "qdrant-client>=1.16.1",
    "redis>=8,<9",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "grpcio-tools>=1.80.0",
    "jsonschema>=4.23.0",
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/rag",
    "src/migration",
    "src/generated",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: needs the compose infra (Redis, MinIO, Qdrant; `make up`); run with -m integration",
    "ollama: needs the host Ollama with [rag].embedding_model pulled; run with -m ollama",
    "groq: needs GROQ_API_KEY and network access to Groq; run with -m groq",
]
addopts = "-m 'not integration and not ollama and not groq'"
